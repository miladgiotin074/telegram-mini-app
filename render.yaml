# Render Blueprint: https://dashboard.render.com/blueprints
# After the first deploy, put the onrender.com URL into BotFather as the Mini App URL.
services:
  - type: web
    name: telegram-mini-app
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_MINI_APP_URL
        fromService:
          name: telegram-mini-app
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: MONGODB_URI
        sync: false
